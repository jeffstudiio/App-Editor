# JEFF Creative Studio — CI (P1-M5)
# گیت کیفیت: تایپ‌چک + لینت + تست‌ها روی هر push/PR به main
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck (strict gate)
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Tests (core engine + agent + AI architecture)
        run: npm test
